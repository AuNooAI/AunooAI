# Bedrock-only tenant: primaries are already Bedrock. Keep a Haiku fallback for the
# Sonnet-backed names so a Sonnet hiccup still answers (Bedrock -> Bedrock).

  # Nova tier — cost directive 2026-07-16: avoid Haiku 4.5 unless necessary.
  # nova-lite is 13x cheaper than haiku-4-5; use for numeric scoring /
  # bulk classification. nova-pro for structured extraction.
  - model_name: nova-lite
    litellm_params:
      model: bedrock/us.amazon.nova-lite-v1:0
      api_key: "os.environ/AWS_BEDROCK_API_KEY"
      aws_region_name: "us-east-1"
      additional_drop_params: ["reasoning_effort", "response_format", "thinking"]
  - model_name: nova-pro
    litellm_params:
      model: bedrock/us.amazon.nova-pro-v1:0
      api_key: "os.environ/AWS_BEDROCK_API_KEY"
      aws_region_name: "us-east-1"
      additional_drop_params: ["reasoning_effort", "response_format", "thinking"]

  # Kimi K2.5 — staged 2026-07-20 as enrichment default on bugfixing only.
  # Benchmark run 29beea1b525e: beat Haiku 4.5 89.3% pairwise (dual judge) on the
  # production enrichment prompt at ~half the cost ($0.60/$3.00 vs $1.00/$5.00 per 1M).
  - model_name: bedrock-kimi-k2-5
    litellm_params:
      model: bedrock/moonshotai.kimi-k2.5
      api_key: "os.environ/AWS_BEDROCK_API_KEY"
