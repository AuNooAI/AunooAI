      additional_drop_params: ["reasoning_effort", "response_format", "thinking"]

  # Honest canonical names for the model actually invoked. The vendor-
  # branded aliases above resolve here too and still work; prefer these so
  # stored records name the model that really ran.
  - model_name: claude-haiku-4-5
    litellm_params:
      model: bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0
