# BEDROCK-ONLY tenant config.
# Every model_name is kept identical to the upstream OpenAI/Anthropic names so the
# ~18 hardcoded `model="gpt-5.4"` / `model="gpt-5.4-mini"` call sites resolve, but each
# target is repointed to an AWS Bedrock Claude deployment. All LLM traffic for this
# tenant therefore goes through Bedrock (api_key = AWS_BEDROCK_API_KEY, us-east-1).
#
# Mapping:  flagship / standard names -> Claude Sonnet 4.5
#           mini / nano / small names -> Claude Haiku 4.5
#
# `thinking: {"type": "disabled"}` is REQUIRED on every deployment: the gpt-5* code path
# injects an OpenAI `reasoning_effort` kwarg which litellm translates into an Anthropic
# "thinking" budget that Bedrock rejects (budget<1024 / max_tokens clash), silently
# killing the call. Disabling thinking makes every deployment answer regardless of the
# originating model's reasoning params.

model_list:
  # ---- mini / nano / small -> Bedrock Claude Haiku 4.5 ----
  - model_name: gpt-4.1-mini
    model_info:
      legacy_alias: true
    litellm_params:
      model: bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0
      api_key: "os.environ/AWS_BEDROCK_API_KEY"
      aws_region_name: "us-east-1"
      thinking: {"type": "disabled"}
      additional_drop_params: ["reasoning_effort", "response_format"]

  - model_name: gpt-4o-mini
    model_info:
