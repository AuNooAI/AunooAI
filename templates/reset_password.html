<!DOCTYPE html>
<html>
<head>
    <title>Reset Password - AuNoo AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
    <div class="container">
        <div class="login-container">
            <h2>Reset Password</h2>
            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            {% if not token_valid %}
            <p class="text-muted">This reset link is invalid or has expired. Ask your administrator to send a new one.</p>
            <a href="/login" class="btn btn-primary w-100 mt-2">Back to login</a>
            {% else %}
            <p class="text-muted">Set a new password for <strong>{{ username }}</strong>.</p>
            <form method="post" action="/reset-password" onsubmit="return validateForm()">
                <input type="hidden" name="u" value="{{ username }}">
                <input type="hidden" name="exp" value="{{ exp }}">
                <input type="hidden" name="token" value="{{ token }}">
                <div class="mb-3">
                    <label for="new_password" class="form-label">New Password</label>
                    <input type="password" class="form-control" id="new_password" name="new_password" required minlength="8">
                    <small class="text-muted">At least 8 characters.</small>
                </div>
                <div class="mb-3">
                    <label for="confirm_password" class="form-label">Confirm New Password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                    <div id="match-check" class="mt-2 d-none text-danger">
                        <small>❌ Passwords do not match</small>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Set new password</button>
            </form>
            {% endif %}
        </div>
    </div>
    <script>
    function validateForm() {
        const np = document.getElementById('new_password').value;
        const cp = document.getElementById('confirm_password').value;
        const match = document.getElementById('match-check');
        if (np !== cp) { match.classList.remove('d-none'); return false; }
        if (np.length < 8) return false;
        match.classList.add('d-none');
        return true;
    }
    </script>
</body>
</html>
