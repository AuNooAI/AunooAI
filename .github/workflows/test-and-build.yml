name: Backend Tests & Frontend Build

on:
  push:
  pull_request:

jobs:

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: aunoo_user
          POSTGRES_PASSWORD: aunoo_secure_2025
          POSTGRES_DB: aunoo_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aunoo_user -d aunoo_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_TYPE: postgresql
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: aunoo_user
      DB_PASSWORD: aunoo_secure_2025
      DB_NAME: aunoo_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio psycopg2-binary

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h $DB_HOST -p $DB_PORT -U $DB_USER && break
            sleep 2
          done

      - name: Run database migrations
        run: |
          if [ -f alembic.ini ]; then
            alembic upgrade head
          else
            echo "No alembic.ini found, skipping migrations"
          fi

      - name: Run all backend tests
        run: pytest tests/ -v



  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Build frontend
        working-directory: ui
        run: npm run build